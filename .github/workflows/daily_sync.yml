name: Daily Docs Sync Job

on:
  schedule:
    # Chạy vào 00:00 UTC hằng ngày
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép bấm Run thủ công bất cứ lúc nào

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Daily Sync Job
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py

      - name: Commit delta state changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/articles/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync delta state [skip ci]" && git push)